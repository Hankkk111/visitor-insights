[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visitor-pipeline"
version = "0.1.0"
description = "Ingests weather, public-holiday and ticketing data into a DuckDB/MotherDuck warehouse"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
visitor-pipeline = "visitor_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["visitor_pipeline*"]

[tool.setuptools.package-data]
visitor_pipeline = ["sql/*.sql", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
